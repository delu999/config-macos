# Preserve the commands excluded from the old Zsh history.
history_filter = ['^(clear|exit|squash|gs|gl|ll|cd|cl|co|history)$']

# Search all sessions with Ctrl+R; match the typed prefix with Up.
search_mode = "fuzzy"
filter_mode = "global"
search_mode_shell_up_key_binding = "prefix"

# Put the search field first and select commands for editing before execution.
invert = true
enter_accept = false

[ui]
columns = ["datetime", "duration", "command"]
