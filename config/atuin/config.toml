history_filter = ['^(clear|exit|squash|gs|gl|ll|cd|cl|co|history)$']

# Search all sessions with Ctrl+R; match the typed prefix with Up.
search_mode = "fuzzy"
filter_mode = "global"
search_mode_shell_up_key_binding = "prefix"

# Put the search field first and select commands for editing before execution.
invert = false
style = "full"
enter_accept = true
filter_mode_shell_up_key_binding = "directory"

# Hide the version/help/history-count row and Search/Inspect tabs.
show_help = false
show_tabs = false
show_numeric_shortcuts = false
show_preview = false

[ui]
columns = [
  "exit", 
  { type = "duration", width = 7 },
  { type = "datetime", width = 28 },
  "command"
]
syntax_highlight = false
